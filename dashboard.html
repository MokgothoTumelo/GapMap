<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Guest Lock: must be the first thing loaded so it can hide the page
       before any protected content paints. See frontend/js/auth-guard.js -->
  <script src="frontend/js/auth-guard.js"></script>
  <script>GapMapAuth.lockPage();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The Concept Graph loader (ADR-0006) parses YAML with the vendored copy. -->
  <script src="frontend/vendor/js-yaml.min.js"></script>
  <title>Your GapMap – Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="frontend/agentPanel/agent-panel.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #1A1A2E;
      background: #F8FAFC;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .nav {
      background: white; border-bottom: 1.5px solid #E5E7EB;
      padding: 14px 32px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 1.25rem; color: #1A1A2E; text-decoration: none;
    }
    .logo-icon {
      width: 28px; height: 28px; background: #3B5BDB; border-radius: 50%;
      display: grid; place-items: center; position: relative;
    }
    .logo-icon::after {
      content: ''; width: 9px; height: 9px; background: white;
      border-radius: 50% 50% 50% 0; transform: rotate(-45deg); margin-top: -1px;
    }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .back-link {
      font-size: 0.9rem; color: #5A5A72; text-decoration: none; font-weight: 500;
    }
    .back-link:hover { color: #1A1A2E; }
    .subject-pill {
      background: #EEF2FF; color: #3B5BDB; font-size: 0.85rem;
      font-weight: 600; padding: 6px 14px; border-radius: 20px;
    }
    .avatar {
      width: 36px; height: 36px; background: #3B5BDB; color: white;
      border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 0.9rem;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
    .polar-notice {
      max-width: 1100px; margin: 18px auto 0; padding: 0 24px;
    }
    .polar-notice-inner {
      background: #ECFDF5; color: #065F46; border: 1.5px solid #A7F3D0;
      border-radius: 12px; padding: 14px 16px; font-size: 0.9rem; line-height: 1.5;
    }
    .polar-notice-inner strong { font-weight: 700; }

    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
    .page-header p { color: #5A5A72; font-size: 1rem; }

    .score-card {
      background: white; border: 1.5px solid #E5E7EB; border-radius: 16px;
      padding: 28px 32px; margin-bottom: 28px; display: flex; align-items: center; gap: 40px;
      box-shadow: 0 4px 20px -8px rgba(0,0,0,0.06);
    }
    .score-circle {
      width: 110px; height: 110px; border-radius: 50%;
      display: grid; place-items: center; position: relative; flex-shrink: 0;
    }
    .score-circle::before {
      content: ''; position: absolute; width: 84px; height: 84px;
      background: white; border-radius: 50%;
    }
    .score-value { position: relative; z-index: 1; font-size: 1.6rem; font-weight: 800; color: #1A1A2E; }
    .score-info h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
    .score-info p { color: #5A5A72; font-size: 0.95rem; max-width: 420px; }
    .score-meta { display: flex; gap: 20px; margin-top: 14px; font-size: 0.85rem; color: #5A5A72; }
    .score-meta span strong { color: #1A1A2E; }

    .section-title {
      font-size: 1.1rem; font-weight: 700; margin-bottom: 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-title a { font-size: 0.85rem; font-weight: 500; color: #3B5BDB; text-decoration: none; }

    .gap-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px; margin-bottom: 36px;
    }
    .concept-card {
      background: white; border: 1.5px solid #E5E7EB; border-radius: 14px;
      padding: 20px; transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer; text-decoration: none; color: inherit; display: block;
    }
    .concept-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px -10px rgba(0,0,0,0.1); }
    .concept-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .concept-name { font-weight: 600; font-size: 1rem; }
    .status-badge { font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
    .status-strong { background: #ECFDF5; color: #10B981; }
    .status-improve { background: #FFFBEB; color: #F59E0B; }
    .status-weak { background: #FEF2F2; color: #EF4444; }

    .progress-bar { height: 8px; background: #F3F4F6; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
    .fill-strong { background: #10B981; }
    .fill-improve { background: #F59E0B; }
    .fill-weak { background: #EF4444; }
    .score-text { font-size: 0.85rem; color: #5A5A72; }
    .score-text strong { color: #1A1A2E; }

    .path-card {
      background: white; border: 1.5px solid #E5E7EB; border-radius: 16px;
      padding: 24px 28px; box-shadow: 0 4px 20px -8px rgba(0,0,0,0.06);
    }
    .path-item {
      display: flex; align-items: center; gap: 16px; padding: 14px 0;
      border-bottom: 1px solid #F3F4F6;
    }
    .path-item:last-child { border-bottom: none; }
    .path-number {
      width: 32px; height: 32px; background: #EEF2FF; color: #3B5BDB;
      border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.9rem; flex-shrink: 0;
    }
    .path-number.current { background: #3B5BDB; color: white; }
    .path-info { flex: 1; }
    .path-info h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
    .path-info p { font-size: 0.8rem; color: #5A5A72; }
    .path-action {
      font-size: 0.85rem; font-weight: 600; color: #3B5BDB; text-decoration: none;
      padding: 8px 14px; border-radius: 8px; background: #EEF2FF; transition: background 0.2s;
    }
    .path-action:hover { background: #DBE4FF; }

    /* Root cause (ADR-0006): the Foundational Gap the path starts at. */
    .root-cause-card {
      background: #FFF7ED; border: 1.5px solid #FDBA74; border-radius: 16px;
      padding: 18px 22px; display: flex; gap: 16px; align-items: flex-start;
      margin-bottom: 24px;
    }
    .rc-badge {
      flex-shrink: 0; background: #FB923C; color: white; font-size: 0.7rem;
      font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 6px 12px; border-radius: 20px; height: fit-content; margin-top: 2px;
    }
    .rc-body h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
    .rc-body p { font-size: 0.9rem; color: #5A5A72; }
    .origin-chip {
      display: inline-block; background: #FEF3C7; color: #92400E; font-size: 0.7rem;
      font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-left: 8px;
      vertical-align: 2px;
    }
    .path-root-badge {
      display: inline-block; background: #FB923C; color: white; font-size: 0.68rem;
      font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 10px; margin-left: 8px; vertical-align: 2px;
    }
    .path-connector {
      display: flex; align-items: center; gap: 6px; margin: 2px 0 2px 16px;
      color: #94A3B8; font-size: 0.74rem; font-weight: 600;
    }
    .path-connector svg { flex-shrink: 0; color: #C5C9D4; }
    .path-source-note { font-size: 0.78rem; color: #5A5A72; margin-bottom: 10px; }
    .path-source-note code {
      background: #F1F5F9; padding: 1px 6px; border-radius: 6px; font-size: 0.72rem;
    }
    .path-data-toggle {
      font-size: 0.78rem; font-weight: 600; color: #3B5BDB; background: #EEF2FF;
      border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer;
      transition: background 0.2s; margin-left: 10px;
    }
    .path-data-toggle:hover { background: #DBE4FF; }
    .path-data {
      display: none; margin-top: 14px; padding: 14px 16px;
      background: #0F172A; color: #E2E8F0; border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.74rem; line-height: 1.5;
      max-height: 340px; overflow: auto; white-space: pre;
    }
    .path-data.open { display: block; }

    /* Quantum study-plan optimiser (QAOA, simulated) */
    .qp-card {
      background: linear-gradient(135deg, #F5F3FF, #EEF2FF); border: 1.5px solid #DDD6FE;
      border-radius: 16px; padding: 20px 22px; margin-bottom: 24px;
    }
    .qp-tag {
      display: inline-block; background: #1E1B4B; color: #fff; font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 9px; border-radius: 10px;
      margin-left: 10px; vertical-align: 3px;
    }
    .qp-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.9rem; color: #1A1A2E; margin-bottom: 14px; }
    .qp-controls select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1.5px solid #DDD6FE; background: #fff; }
    .qp-list { list-style: none; margin: 0 0 10px; padding: 0; }
    .qp-list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #E9E5FF; }
    .qp-list li:last-child { border-bottom: none; }
    .qp-num { width: 28px; height: 28px; border-radius: 50%; background: #6D28D9; color: #fff; display: grid; place-items: center; font-size: 0.8rem; font-weight: 700; flex-shrink: 0; }
    .qp-name { font-weight: 600; font-size: 0.95rem; }
    .qp-why { font-size: 0.8rem; color: #5A5A72; }
    .qp-later { font-size: 0.82rem; color: #5A5A72; margin: 4px 0 10px; }
    .qp-stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .qp-chip { background: #fff; border: 1px solid #DDD6FE; color: #6D28D9; font-size: 0.74rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
    .qp-verify { font-size: 0.82rem; color: #374151; line-height: 1.5; margin: 6px 0 0; }
    .qp-how-body { display: none; margin-top: 12px; font-size: 0.84rem; color: #374151; line-height: 1.55; }
    .qp-how-body.open { display: block; }
    .qp-how-body ol { margin: 6px 0 10px 18px; padding: 0; }
    .qp-how-body li { margin-bottom: 4px; }
    .qp-how-body pre { background: #0F172A; color: #E2E8F0; border-radius: 10px; padding: 12px 14px; font-size: 0.72rem; max-height: 220px; overflow: auto; }

    .cta-row { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px;
      border-radius: 10px; font-weight: 600; font-size: 0.95rem; cursor: pointer; border: none; transition: all 0.2s; text-decoration: none;
    }
    .btn-primary { background: #3B5BDB; color: white; }
    .btn-primary:hover { background: #2F4AC0; }
    .btn-outline { background: white; border: 1.5px solid #E5E7EB; color: #1A1A2E; }
    .btn-outline:hover { border-color: #C5C9D4; background: #FAFAFA; }

    .empty-state {
      text-align: center; padding: 60px 20px; background: white;
      border: 1.5px solid #E5E7EB; border-radius: 16px;
    }
    .empty-state h2 { font-size: 1.3rem; margin-bottom: 10px; }
    .empty-state p { color: #5A5A72; margin-bottom: 24px; }

    @media (max-width: 700px) {
      .score-card { flex-direction: column; text-align: center; gap: 20px; }
      .score-meta { justify-content: center; }
      .nav { padding: 12px 16px; }
      .container { padding: 24px 16px 60px; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="logo">
      <div class="logo-icon"></div>
      GapMap
    </a>
    <div class="nav-right">
      <div id="subjectSwitcherMount"></div>
      <div id="languageSwitcherMount"></div>
      <a href="library.html" class="back-link">Library</a>
      <div class="avatar" id="avatar">U</div>
    </div>
  </nav>

  <div class="polar-notice" id="polarNotice" style="display:none;"></div>

  <div class="container" id="app"></div>

  <script type="module">
  import { buildLearningPath, mistakeKindsByConcept } from './core/learning-path.js';
  import { optimiseStudyPlan, MAX_PLAN_CONCEPTS } from './core/quantum-qaoa.js';
  import { createSubjectStore } from './frontend/js/subject-store.js';
  import { createMockLearnerStore, getCurrentLearnerId } from './frontend/js/learner-store.js';

  (async function () {
    // Polar checkout return: success_url lands here with ?checkout_id= (a
    // Polar-issued id = proof of a real checkout) and ?plan=. This runs
    // BEFORE requireAuth(): a returning Learner has no billing record yet,
    // so the gate would bounce them back to subscription.html first.
    // (Interim: the Firebase webhook in docs/polar-billing-handoff.md
    // replaces the local record once the Firebase teammate lands it.)
    (function handlePolarReturn() {
      let params = null;
      try { params = new URLSearchParams(window.location.search); } catch (e) { return; }
      const checkoutId = params.get('checkout_id');
      if (!checkoutId) return;
      const sessionUser = GapMapAuth.getUser();
      if (!sessionUser) {
        window.location.replace('login.html');
        return;
      }
      const plan = params.get('plan') === 'annual' ? 'annual' : 'monthly';
      GapMapAuth.startTrial(sessionUser, { polarCheckoutId: checkoutId, planKey: plan });
      try {
        const url = new URL(window.location.href);
        url.searchParams.delete('checkout_id');
        url.searchParams.delete('plan');
        window.history.replaceState({}, '', url.toString());
      } catch (e) {}
      const mount = document.getElementById('polarNotice');
      if (mount) {
        mount.style.display = '';
        mount.innerHTML = '<div class="polar-notice-inner"><strong>Card added — your 30-day free trial has started.</strong> You won\'t be charged until day 30.</div>';
      }
    })();

    // Guest Lock: guests are redirected to Login (or to Setup, if setup
    // isn't complete yet) before any of the code below runs — the `return`
    // stops dashboard data from ever initializing or rendering for them.
    const user = GapMapAuth.requireAuth();
    if (!user) return;

    // Subject + Language stay in the nav (context switches); identity,
    // Explanation Level and Log out live behind the avatar.
    GapMapAuth.mountSubjectSwitcher({
      container: '#subjectSwitcherMount',
      onChange: function () {
        // Stay on the dashboard — just re-render with the new Subject's data
        render();
      }
    });
    GapMapAuth.mountLanguageSwitcher({ container: '#languageSwitcherMount' });
    GapMapAuth.mountProfileMenu({ avatar: '#avatar' });

    function loadResults() {
      const subject = GapMapAuth.getActiveSubject();
      return GapMapAuth.loadDiagnosticResults(subject);
    }

    // ADR-0006: the Subject store holds the Concept Graph — subject-level
    // data shared by all Learners, never stored per Learner. A Subject
    // without a graph, or an unreadable one, falls back to the severity
    // order; the fallback is the honesty rule.
    const subjectStore = createSubjectStore();
    async function conceptGraphFor(user) {
      try {
        return await subjectStore.getConceptGraph({
          grade: user.grade,
          subject: GapMapAuth.getActiveSubject(),
        });
      } catch (error) {
        console.warn('[Dashboard] Concept Graph unavailable — severity order only.', error);
        return null;
      }
    }

    // Mistake-Diagnosis evidence for the root-cause readout: joined from the
    // Learner's own Attempts against the Assessments' wrong_explanations.
    async function mistakeEvidence(learnerId) {
      try {
        const store = createMockLearnerStore({ storage: localStorage });
        const context = await store.getContext(learnerId);
        return mistakeKindsByConcept(context.assessments, context.attempts);
      } catch (_error) {
        return {};
      }
    }

    async function render() {
      const data = loadResults();
      const app = document.getElementById('app');

      if (!data) {
        const subj = GapMapAuth.getActiveSubject() || 'this subject';
        app.innerHTML = `
          <div class="empty-state">
            <h2>No diagnostic results yet for ${subj}</h2>
            <p>Take the Diagnostic so GapMap can build your personalised Gap Map for ${subj}.</p>
            <a href="diagnostic.html" class="btn btn-primary">Start Diagnostic</a>
          </div>
        `;
        return;
      }

      const { overall, concepts } = data;

      let weakCount = 0, improveCount = 0;
      Object.values(concepts).forEach(c => {
        if (c.status === 'weak') weakCount++;
        else if (c.status === 'improve') improveCount++;
      });

      const cardsHtml = Object.entries(concepts).map(([name, c]) => {
        const statusLabel = c.status === 'strong' ? '✓ Strong' : c.status === 'improve' ? '! Improve' : '✕ Weak';
        return `
          <a href="concept.html?concept=${encodeURIComponent(name)}" class="concept-card">
            <div class="concept-header">
              <span class="concept-name">${name}</span>
              <span class="status-badge status-${c.status}">${statusLabel}</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill fill-${c.status}" style="width: ${c.score}%"></div>
            </div>
            <div class="score-text"><strong>${c.score}%</strong> · ${c.correct}/${c.total} correct</div>
          </a>
        `;
      }).join('');

      // The Learning Path is a derivation, not a stored list (ADR-0006):
      // graph + Gap Map → roots first, severity as tie-break.
      const gapMapEntries = Object.entries(concepts).map(([concept, c]) => ({
        concept,
        pct: c.score,
        correct: c.correct,
        total: c.total,
        status: c.status,
      }));
      const graph = await conceptGraphFor(user);
      const evidence = await mistakeEvidence(getCurrentLearnerId({ storage: localStorage }));
      const derived = buildLearningPath({ gapMap: gapMapEntries, graph, mistakeKinds: evidence });
      const path = derived.path;
      const root = derived.rootCauses[0] || null;
      const byConcept = new Map(path.map((entry) => [entry.concept, entry]));

      // The Learning Path as a dependency chain (flow: see-why-you're-stuck,
      // step 3): root first, arrow connectors naming the dependency each node
      // satisfies. Without a graph the severity order keeps the original
      // labels — the fallback the flow pins.
      const isRoot = (entry) => Boolean(root && root.concept === entry.concept);
      const pathHtml = path.map((entry, i) => {
        const isFirst = i === 0;
        const hasGraph = Boolean(graph);
        const origin = entry.origin ? ` <span class="origin-chip">Grade ${entry.origin}</span>` : '';
        const node = `
          <div class="path-item">
            <div class="path-number ${isFirst ? 'current' : ''}">${i + 1}</div>
            <div class="path-info">
              <h4>${entry.concept}${origin}${hasGraph && isRoot(entry) ? ' <span class="path-root-badge">Root</span>' : ''}</h4>
              <p>Currently ${entry.pct}%</p>
            </div>
            <a href="concept.html?concept=${encodeURIComponent(entry.concept)}" class="path-action">${isFirst ? 'Start →' : 'View'}</a>
          </div>
        `;
        const next = path[i + 1];
        if (!next) return node;
        const label = hasGraph
          ? (next.blockedBy.includes(entry.concept)
            ? `unblocks ${next.concept}`
            : 'next')
          : (isFirst ? 'Next' : 'Then improve');
        const connector = `
          <div class="path-connector">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
              <path d="M8 2v10M4 8l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>${label}</span>
          </div>
        `;
        return node + connector;
      }).join('');

      // The root-cause readout: what the path starts at and *why* — blocking
      // plus, when the artefacts carry Mistake Diagnoses, the evidence.
      let rootCauseHtml = '';
      if (root) {
        const blocking = root.blocks.length === 1
          ? root.blocks[0]
          : `${root.blocks.slice(0, -1).join(', ')} and ${root.blocks[root.blocks.length - 1]}`;
        const evidenceSentences = root.blocks
          .map((name) => byConcept.get(name))
          .filter((entry) => entry.evidence && entry.evidence.prerequisiteFailures[root.concept])
          .map((entry) => {
            const count = entry.evidence.prerequisiteFailures[root.concept];
            const total = entry.evidence.wrong;
            return `${count} of your ${total} wrong ${entry.concept} response${total === 1 ? ' was' : 's were'} prerequisite failures pointing back here.`;
          });
        rootCauseHtml = `
          <div class="root-cause-card" id="rootCauseBanner">
            <div class="rc-badge">Root cause</div>
            <div class="rc-body">
              <h3>${root.concept}${root.origin ? ` <span class="origin-chip">Grade ${root.origin}</span>` : ''}</h3>
              <p>${root.concept} sits at ${root.pct}%, and ${blocking} depend${root.blocks.length === 1 ? 's' : ''} on it — strengthening it lifts ${root.blocks.length === 1 ? 'it' : 'both'} too.${evidenceSentences.length ? ' ' + evidenceSentences.join(' ') : ''}</p>
            </div>
          </div>
        `;
      }

      const firstOnPath = path.length ? path[0].concept : (Object.keys(concepts)[0] || 'Factorisation');
      const greeting = user && user.firstName ? user.firstName : 'Learner';

      const subjLabel = GapMapAuth.getActiveSubject() || 'your subject';

      // The derived path object — the same entries, roots, and evidence the
      // Companion's getLearningPath tool returns — made inspectable to the
      // Learner (flow: see-why-you're-stuck, step 5). Escaped because it is
      // interpolated into HTML.
      const escapeHtml = (text) => String(text)
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
      // Quantum study plan (QAOA on simulated qubits): shown when there are at
      // least two weak Concepts to choose between. Filled in after first paint.
      const qpMax = Math.min(path.length, 6);
      const qpDefault = Math.min(3, qpMax);
      const qpMarkup = path.length >= 2 ? `
        <div class="section-title">Quantum Study Plan <span class="qp-tag">QAOA · simulated qubits</span></div>
        <div class="qp-card" id="qpCard">
          <p class="path-source-note">Which Concepts give you the most progress for the time you have? GapMap turns that into a quantum optimisation problem and solves it with a QAOA circuit, then checks the answer against classical search.</p>
          <div class="qp-controls">
            <label for="qpBudget">This week I can study</label>
            <select id="qpBudget">${Array.from({ length: qpMax }, (_v, i) => i + 1).map((k) => `<option value="${k}"${k === qpDefault ? ' selected' : ''}>${k}</option>`).join('')}</select>
            <span>Concept${qpMax === 1 ? '' : 's'}</span>
          </div>
          <div id="qpResult" aria-live="polite">Running the quantum circuit…</div>
        </div>
      ` : '';

      app.innerHTML = `
        <div class="page-header">
          <h1>Your Knowledge Gap Map · ${subjLabel}</h1>
          <p>Hi ${greeting}. Based on your Diagnostic for ${subjLabel}. Focus on the weak Concepts first — that’s how you improve fastest.</p>
        </div>

        ${rootCauseHtml}

        <div class="score-card">
          <div class="score-circle" style="background: conic-gradient(#3B5BDB 0% ${overall}%, #E5E7EB ${overall}% 100%);">
            <span class="score-value">${overall}%</span>
          </div>
          <div class="score-info">
            <h2>Overall Score: ${overall}%</h2>
            <p>A single percentage doesn’t tell you what to study. GapMap shows you exactly which Concepts need attention.</p>
            <div class="score-meta">
              <span><strong>${Object.keys(concepts).length}</strong> Concepts assessed</span>
              <span><strong>${weakCount}</strong> weak</span>
              <span><strong>${improveCount}</strong> needs improvement</span>
            </div>
          </div>
        </div>

        <div class="section-title">
          Concept Breakdown
          <a href="diagnostic.html">Retake Diagnostic →</a>
        </div>

        <div class="gap-grid">${cardsHtml}</div>

        <div class="section-title">Your Learning Path</div>
        <div class="path-card">
          ${pathHtml}
        </div>

        ${qpMarkup}

        <div class="cta-row">
          <a href="concept.html?concept=${encodeURIComponent(firstOnPath)}" class="btn btn-primary">
            Start with ${firstOnPath}
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <a href="diagnostic.html" class="btn btn-outline">Retake Diagnostic</a>
        </div>
      `;

      wireQuantumStudyPlan({ gapMapEntries, graph });
    }

    // Runs the QAOA study-plan optimiser (core/quantum-qaoa.js) and renders the
    // result. It runs after first paint (setTimeout) so the page never waits on it.
    function wireQuantumStudyPlan({ gapMapEntries, graph }) {
      const card = document.getElementById('qpCard');
      if (!card) return;
      const select = document.getElementById('qpBudget');
      const out = document.getElementById('qpResult');
      const esc = (text) => String(text)
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
      const pct = (value) => (value * 100 < 10 ? (value * 100).toFixed(1) : Math.round(value * 100)) + '%';

      function show(plan) {
        const q = plan.qaoa;
        const list = plan.selected.map((entry, i) => `
          <li>
            <span class="qp-num">${i + 1}</span>
            <div style="flex:1">
              <div class="qp-name">${esc(entry.concept)} <span class="qp-why">· ${entry.pct}%</span></div>
              <div class="qp-why">${esc(entry.reason)}</div>
            </div>
            <a href="concept.html?concept=${encodeURIComponent(entry.concept)}" class="path-action">${i === 0 ? 'Start →' : 'View'}</a>
          </li>`).join('');
        const later = plan.deferred.length
          ? `<p class="qp-later"><strong>Later:</strong> ${plan.deferred.map((entry) => esc(entry.concept)).join(', ')}</p>`
          : '';
        let chips = '';
        let verify = plan.note ? `<p class="qp-verify">${esc(plan.note)}</p>` : '';
        if (q) {
          chips = `<div class="qp-stats">
            <span class="qp-chip">${q.qubits} qubits (1 per Concept)</span>
            <span class="qp-chip">${q.layers} QAOA layers</span>
            <span class="qp-chip">${q.gateCount} gates</span>
            <span class="qp-chip">${q.shots.toLocaleString()} measurements</span>
          </div>`;
          verify = plan.matchesClassical
            ? `<p class="qp-verify">✓ <strong>Checked against classical search:</strong> same plan. The optimal plan turned up in ${pct(q.optimumProbability)} of measurements; blind guessing would hit it ${pct(q.randomGuessProbability)} of the time.</p>`
            : `<p class="qp-verify">The quantum run found a valid plan, but exhaustive classical search found a better one: <strong>${plan.classical.selected.map(esc).join(', ')}</strong>. (A simulated run can miss the optimum; that is why GapMap checks.)</p>`;
        }
        out.innerHTML = `<ol class="qp-list">${list}</ol>${later}${chips}${verify}
          ${plan.truncated ? `<p class="qp-later">Planning considered the ${MAX_PLAN_CONCEPTS} Concepts with the most to gain.</p>` : ''}`;
      }

      function run() {
        out.textContent = 'Running the quantum circuit…';
        setTimeout(() => {
          try {
            show(optimiseStudyPlan({ gapMap: gapMapEntries, graph, budget: Number(select.value) }));
          } catch (error) {
            console.warn('[Quantum Study Plan] unavailable', error);
            card.style.display = 'none';
          }
        }, 30);
      }

      select.addEventListener('change', run);
      run();
    }

    await render();
  })();
  </script>
  <script src="frontend/agentPanel/agent-panel.js"></script>
</body>
</html>
