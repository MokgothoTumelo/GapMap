# GapMap Concept Graph – Grade 12 Mathematics (authored, inspectable subject data)
#
# ADR-0006: the Subject-level map of Concepts and their Prerequisite edges,
# spanning grades where a Concept builds on earlier years' work. This file is
# the format's inspectable sample — not application state. The Learning Path
# is derived from this graph and the Gap Map (core/learning-path.js): roots
# first, severity as tie-break.
