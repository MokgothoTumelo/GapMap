# The demo narrative: Factorisation (Grade 9 origin) is weak AND blocks
# Quadratic Equations (also weak) — so the path starts at Factorisation, below
# the Learner's grade, because strengthening it lifts both. A Learner who did
# Mathematical Literacy meets this as a Foundational Gap: the graph is where
# "your path starts below your grade" becomes data instead of a claim.
