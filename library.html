<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Guest Lock: must be first so it can hide the page before paint -->
  <script src="frontend/js/auth-guard.js"></script>
  <script>GapMapAuth.lockPage();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Library – GapMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="frontend/agentPanel/agent-panel.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #1A1A2E;
      background: #F8FAFC;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .nav {
      background: white; border-bottom: 1.5px solid #E5E7EB;
      padding: 14px 32px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 1.25rem; color: #1A1A2E; text-decoration: none;
    }
    .logo-icon {
      width: 28px; height: 28px; background: #3B5BDB; border-radius: 50%;
      display: grid; place-items: center; position: relative;
    }
    .logo-icon::after {
      content: ''; width: 9px; height: 9px; background: white;
      border-radius: 50% 50% 50% 0; transform: rotate(-45deg); margin-top: -1px;
    }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .back-link {
      font-size: 0.9rem; color: #5A5A72; text-decoration: none; font-weight: 500;
    }
    .back-link:hover { color: #1A1A2E; }
    .back-link.active { color: #3B5BDB; font-weight: 600; }
    .subject-pill {
      background: #EEF2FF; color: #3B5BDB; font-size: 0.85rem;
      font-weight: 600; padding: 6px 14px; border-radius: 20px;
    }
    .avatar {
      width: 36px; height: 36px; background: #3B5BDB; color: white;
      border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 0.9rem;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }

    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
    .page-header p { color: #5A5A72; font-size: 1rem; }

    /* Material type chips */
    .chips-row {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px;
    }
    .chip {
      padding: 8px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; border: 1.5px solid #E5E7EB; background: white; color: #5A5A72;
      transition: all 0.2s;
    }
    .chip:hover { border-color: #C5C9D4; background: #FAFAFA; }
    .chip.active {
      background: #3B5BDB; color: white; border-color: #3B5BDB;
    }

    /* Search + subject chips */
    .secondary-row {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 16px; margin-bottom: 24px;
    }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: white; border: 1.5px solid #E5E7EB; border-radius: 10px;
      padding: 10px 16px; flex: 1; max-width: 320px;
    }
    .search-box input {
      border: none; outline: none; font-size: 0.95rem; font-family: inherit; width: 100%;
      color: #1A1A2E; background: transparent;
    }
    .search-box input::placeholder { color: #9CA3AF; }
    .search-box svg { color: #9CA3AF; flex-shrink: 0; }
    .subject-chips {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .subject-chip {
      padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 500;
      cursor: pointer; border: 1.5px solid #E5E7EB; background: white; color: #5A5A72;
      transition: all 0.2s;
    }
    .subject-chip:hover { border-color: #C5C9D4; background: #FAFAFA; }
    .subject-chip.active {
      background: #EEF2FF; color: #3B5BDB; border-color: #3B5BDB;
    }

    /* Resource grid */
    .resource-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px; margin-bottom: 40px;
    }
    .resource-card {
      background: white; border: 1.5px solid #E5E7EB; border-radius: 16px;
      overflow: hidden; box-shadow: 0 4px 20px -8px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column;
    }
    .resource-card:hover {
      transform: translateY(-3px); box-shadow: 0 12px 28px -10px rgba(0,0,0,0.1);
    }
    .preview-area {
      height: 160px; background: #F3F4F6; display: grid; place-items: center;
      color: #9CA3AF; font-size: 0.85rem; border-bottom: 1px solid #E5E7EB;
      position: relative;
    }
    .preview-area img {
      width: 100%; height: 100%; object-fit: cover; object-position: top;
    }
    .preview-placeholder {
      text-align: center; padding: 20px;
    }
    .preview-placeholder svg { margin-bottom: 8px; color: #C5C9D4; }
    .card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
    .card-body h3 {
      font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; line-height: 1.35;
    }
    .card-meta {
      font-size: 0.85rem; color: #5A5A72; margin-bottom: 10px; display: flex;
      flex-wrap: wrap; gap: 6px 12px;
    }
    .type-badge {
      display: inline-block; background: #EEF2FF; color: #3B5BDB;
      font-size: 0.75rem; font-weight: 600; padding: 3px 10px; border-radius: 20px;
      margin-bottom: 10px; align-self: flex-start;
    }
    .card-desc {
      font-size: 0.9rem; color: #5A5A72; line-height: 1.5; margin-bottom: 16px; flex: 1;
    }
    .card-actions { display: flex; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; border: none; transition: all 0.2s; text-decoration: none; flex: 1;
    }
    .btn-primary { background: #3B5BDB; color: white; }
    .btn-primary:hover { background: #2F4AC0; }
    .btn-outline { background: white; border: 1.5px solid #E5E7EB; color: #1A1A2E; }
    .btn-outline:hover { border-color: #C5C9D4; background: #FAFAFA; }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 60px 20px; background: white;
      border: 1.5px solid #E5E7EB; border-radius: 16px; margin-bottom: 40px;
    }
    .empty-state h2 { font-size: 1.3rem; margin-bottom: 10px; }
    .empty-state p { color: #5A5A72; margin-bottom: 24px; }

    @media (max-width: 700px) {
      .nav { padding: 12px 16px; }
      .container { padding: 24px 16px 60px; }
      .secondary-row { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="logo">
      <div class="logo-icon"></div>
      GapMap
    </a>
    <div class="nav-right">
      <span class="subject-pill" id="subjectPill" style="display:none;"></span>
      <a href="dashboard.html" class="back-link">Dashboard</a>
      <a href="library.html" class="back-link active">Library</a>
      <a href="#" id="logoutLink" class="back-link">Log out</a>
      <div class="avatar" id="avatar">U</div>
    </div>
  </nav>

  <div class="container" id="app"></div>

  <script>
  (function () {
    // Guest Lock: redirects to Login or Setup if not authenticated
    const user = GapMapAuth.requireAuth();
    if (!user) return;

    // Avatar
    document.getElementById('avatar').textContent = (user.firstName || 'U').charAt(0).toUpperCase();

    // Subject pill (if set)
    if (user.subject) {
      const pill = document.getElementById('subjectPill');
      pill.textContent = user.subject;
      pill.style.display = 'inline-block';
    }

    // Logout
    document.getElementById('logoutLink').addEventListener('click', function(e) {
      e.preventDefault();
      GapMapAuth.logout('index.html');
    });

    // ========== RESOURCE DATA ==========
    const resources = [
      { id: 1, subject: 'Mathematics', title: 'Mathematics P1 – November 2024', grade: '12', year: '2024', exam: 'NSC', type: 'question-paper', pages: 12, description: 'Trigonometry, algebra, and calculus. Full memo included.', downloadLink: 'https://www.education.gov.za/LinkClick.aspx?fileticket=CsNcmi8-trM%3D&tabid=4933&portalid=0&mid=13146', viewLink: 'https://www.education.gov.za/LinkClick.aspx?fileticket=CsNcmi8-trM%3D&tabid=4933&portalid=0&mid=13146' },
      { id: 2, subject: 'Mathematics', title: 'Mathematics P2 – November 2024', grade: '12', year: '2024', exam: 'NSC', type: 'question-paper', pages: 14, description: 'Geometry, statistics, and data handling. Memo available.', downloadLink: '', viewLink: '' },
      { id: 3, subject: 'Physical Sciences', title: 'Physical Sciences P1 – November 2023', grade: '12', year: '2023', exam: 'NSC', type: 'question-paper', pages: 16, description: 'Physics: mechanics, waves, electricity. With answer key.', downloadLink: 'https://www.education.gov.za/LinkClick.aspx?fileticket=Yak0VdHytZc%3D&tabid=4504&portalid=0&mid=12321', viewLink: 'https://www.education.gov.za/LinkClick.aspx?fileticket=Yak0VdHytZc%3D&tabid=4504&portalid=0&mid=12321' },
      { id: 4, subject: 'Physical Sciences', title: 'Physical Sciences P2 – November 2023', grade: '12', year: '2023', exam: 'NSC', type: 'question-paper', pages: 15, description: 'Chemistry: stoichiometry, organic, equilibrium. Memo.', downloadLink: 'https://www.education.gov.za/LinkClick.aspx?fileticket=3s86L5Ok4Ds%3D&tabid=4504&portalid=0&mid=12321', viewLink: 'https://www.education.gov.za/LinkClick.aspx?fileticket=3s86L5Ok4Ds%3D&tabid=4504&portalid=0&mid=12321' },
      { id: 8, subject: 'Mathematical Literacy', title: 'Mathematical Literacy P1 – November 2024', grade: '12', year: '2024', exam: 'NSC', type: 'question-paper', pages: 13, description: 'Finance, measurement, maps. Memo provided.', downloadLink: 'https://www.education.gov.za/2024NSCNovemberpastpapers.aspx', viewLink: 'https://www.education.gov.za/2024NSCNovemberpastpapers.aspx' },
      { id: 9, subject: 'Mathematical Literacy', title: 'Mathematical Literacy P2 (KWV 08)', grade: '12', year: '2022', exam: 'KWV', type: 'question-paper', pages: 8, description: 'Trigonometry + 2D/3D problems (KWV 08 style).', downloadLink: 'https://www.education.gov.za/LinkClick.aspx?link=3294&tabid=338&portalid=0&mid=1741', viewLink: 'https://www.education.gov.za/LinkClick.aspx?link=3294&tabid=338&portalid=0&mid=1741' },
      { id: 10, subject: 'Mathematics', title: 'Mathematics (KWV 09)', grade: '12', year: '2022', exam: 'KWV', type: 'question-paper', pages: 6, description: '2D and 3D trig · rectangle & windows (KWV 09).', downloadLink: 'https://www.wtstutoring.co.za/wp-content/uploads/2023/01/KWV-09-Trigonometry.pdf', viewLink: 'https://www.wtstutoring.co.za/wp-content/uploads/2023/01/KWV-09-Trigonometry.pdf' },
      { id: 11, subject: 'Mathematics', title: 'Mathematics (KWV 07)', grade: '12', year: '2022', exam: 'KWV', type: 'question-paper', pages: 7, description: 'Trigonometric identities and equations.', downloadLink: 'https://www.wtstutoring.co.za/wp-content/uploads/2023/01/KWV-07-Trigonometry.pdf', viewLink: 'https://www.wtstutoring.co.za/wp-content/uploads/2023/01/KWV-07-Trigonometry.pdf' },
      { id: 12, subject: 'Mathematics', title: 'Mathematics (KWV 10)', grade: '12', year: '2022', exam: 'KWV', type: 'question-paper', pages: 9, description: 'Mixed trig: graphs, reductions, and proofs.', downloadLink: 'https://www.wtstutoring.co.za/wp-content/uploads/2023/01/KWV-10-Trigonometry.pdf', viewLink: 'https://www.wtstutoring.co.za/wp-content/uploads/2023/01/KWV-10-Trigonometry.pdf' }
    ];

    // ========== STATE ==========
    let activeType = 'all';
    let activeSubject = 'all';
    let searchTerm = '';

    const userGrade = user.grade || null;

    // ========== HELPER FUNCTIONS ==========
    function getFilteredResources() {
      let filtered = resources;

      // Filter by grade (from Setup)
      if (userGrade) {
        filtered = filtered.filter(r => r.grade === userGrade);
      }

      // Filter by type
      if (activeType !== 'all') {
        filtered = filtered.filter(r => r.type === activeType);
      }

      // Filter by subject
      if (activeSubject !== 'all') {
        filtered = filtered.filter(r => r.subject === activeSubject);
      }

      // Filter by search term
      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        filtered = filtered.filter(r =>
          r.title.toLowerCase().includes(term) ||
          r.subject.toLowerCase().includes(term) ||
          r.year.includes(term) ||
          r.exam.toLowerCase().includes(term) ||
          r.description.toLowerCase().includes(term)
        );
      }

      return filtered;
    }

    function getAvailableSubjects() {
      const subjects = new Set();
      resources
        .filter(r => !userGrade || r.grade === userGrade)
        .forEach(r => subjects.add(r.subject));
      return ['all', ...Array.from(subjects)];
    }

    // Always show all known types, even if no resources exist yet.
    function getAvailableTypes() {
      return ['all', 'question-paper', 'book', 'study-guide', 'revision', 'memorandum'];
    }

    // ========== RENDER ==========
    function render() {
      const app = document.getElementById('app');
      const filtered = getFilteredResources();
      const subjects = getAvailableSubjects();
      const types = getAvailableTypes();

      const typeLabels = {
        'all': 'All',
        'question-paper': 'Question Papers',
        'book': 'Books',
        'study-guide': 'Study Guides',
        'revision': 'Revision',
        'memorandum': 'Memorandums'
      };

      const typeChipsHtml = types.map(t => `
        <button class="chip ${activeType === t ? 'active' : ''}" data-type="${t}">
          ${typeLabels[t] || t}
        </button>
      `).join('');

      const subjectChipsHtml = subjects.map(s => `
        <button class="subject-chip ${activeSubject === s ? 'active' : ''}" data-subject="${s}">
          ${s === 'all' ? 'All subjects' : s}
        </button>
      `).join('');

      // Empty state message specific to the selected type
      let emptyMessage = 'Try adjusting your filters or search term.';
      if (activeType !== 'all' && typeLabels[activeType]) {
        const typeName = typeLabels[activeType];
        emptyMessage = `No ${typeName} yet. We're adding them soon.`;
      }

      const gridHtml = filtered.length > 0
        ? filtered.map(r => {
            const preview = r.previewImage
              ? `<div class="preview-area"><img src="${r.previewImage}" alt="${r.title} front page"></div>`
              : `<div class="preview-area"><div class="preview-placeholder">
                   <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                   <p>Preview coming soon</p>
                 </div></div>`;

            return `
              <div class="resource-card">
                ${preview}
                <div class="card-body">
                  <span class="type-badge">${typeLabels[r.type] || r.type}</span>
                  <h3>${r.title}</h3>
                  <div class="card-meta">
                    <span>Grade ${r.grade}</span>
                    <span>${r.year}</span>
                    <span>${r.exam}</span>
                  </div>
                  <p class="card-desc">${r.description}</p>
                  <div class="card-actions">
                    <a href="${r.viewLink}" target="_blank" class="btn btn-primary">View</a>
                    ${r.downloadLink ? `<a href="${r.downloadLink}" download target="_blank" class="btn btn-outline">Download</a>` : ''}
                  </div>
                </div>
              </div>
            `;
          }).join('')
        : `
          <div class="empty-state">
            <h2>No resources found</h2>
            <p>${emptyMessage}</p>
            <button class="btn btn-primary" onclick="resetFilters()">Clear Filters</button>
          </div>
        `;

      app.innerHTML = `
        <div class="page-header">
          <h1>Your Grade ${userGrade || '?'} Library</h1>
          <p>Books, question papers, study guides and more – filtered for your grade.</p>
        </div>

        <div class="chips-row">${typeChipsHtml}</div>

        <div class="secondary-row">
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Search by title, year, exam..." value="${searchTerm}">
          </div>
          <div class="subject-chips">${subjectChipsHtml}</div>
        </div>

        <div class="resource-grid">${gridHtml}</div>
      `;

      // Attach event listeners after render
      document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          activeType = chip.dataset.type;
          render();
        });
      });
      document.querySelectorAll('.subject-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          activeSubject = chip.dataset.subject;
          render();
        });
      });
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', (e) => {
        searchTerm = e.target.value.trim();
        render();
      });
    }

    // Expose reset function for empty state
    window.resetFilters = function() {
      activeType = 'all';
      activeSubject = 'all';
      searchTerm = '';
      render();
    };

    // Initial render
    render();
  })();
  </script>
  <script src="frontend/agentPanel/agent-panel.js"></script>
</body>
</html>
