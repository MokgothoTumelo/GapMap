  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #1A1A2E;
      background: #F8FAFC;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .nav {
      background: white; border-bottom: 1.5px solid #E5E7EB;
      padding: 14px 32px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 1.25rem; color: #1A1A2E; text-decoration: none;
    }
    .logo-icon {
      width: 28px; height: 28px; background: #3B5BDB; border-radius: 50%;
      display: grid; place-items: center; position: relative;
    }
    .logo-icon::after {
      content: ''; width: 9px; height: 9px; background: white;
      border-radius: 50% 50% 50% 0; transform: rotate(-45deg); margin-top: -1px;
    }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .back-link {
      font-size: 0.9rem; color: #5A5A72; text-decoration: none; font-weight: 500;
    }
    .back-link:hover { color: #1A1A2E; }
    .back-link.active { color: #3B5BDB; font-weight: 600; }
    .subject-pill {
      background: #EEF2FF; color: #3B5BDB; font-size: 0.85rem;
      font-weight: 600; padding: 6px 14px; border-radius: 20px;
    }
    .avatar {
      width: 36px; height: 36px; background: #3B5BDB; color: white;
      border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 0.9rem;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }

    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
    .page-header p { color: #5A5A72; font-size: 1rem; }

    /* Material type chips */
    .chips-row {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px;
    }
    .chip {
      padding: 8px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; border: 1.5px solid #E5E7EB; background: white; color: #5A5A72;
      transition: all 0.2s;
    }
    .chip:hover { border-color: #C5C9D4; background: #FAFAFA; }
    .chip.active {
      background: #3B5BDB; color: white; border-color: #3B5BDB;
    }

    /* Search + subject chips */
    .secondary-row {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 16px; margin-bottom: 24px;
    }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: white; border: 1.5px solid #E5E7EB; border-radius: 10px;
      padding: 10px 16px; flex: 1; max-width: 320px;
    }
    .search-box input {
      border: none; outline: none; font-size: 0.95rem; font-family: inherit; width: 100%;
      color: #1A1A2E; background: transparent;
    }
    .search-box input::placeholder { color: #9CA3AF; }
    .search-box svg { color: #9CA3AF; flex-shrink: 0; }
    .subject-chips {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .subject-chip {
      padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 500;
      cursor: pointer; border: 1.5px solid #E5E7EB; background: white; color: #5A5A72;
      transition: all 0.2s;
    }
    .subject-chip:hover { border-color: #C5C9D4; background: #FAFAFA; }
    .subject-chip.active {
      background: #EEF2FF; color: #3B5BDB; border-color: #3B5BDB;
    }

    /* Resource grid */
    .resource-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px; margin-bottom: 40px;
    }
    .resource-card {
      background: white; border: 1.5px solid #E5E7EB; border-radius: 16px;
      overflow: hidden; box-shadow: 0 4px 20px -8px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column;
    }

    /* Video thumbnail with play overlay */
    .video-preview {
      position: relative;
      overflow: hidden;
    }
    .video-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
      transition: background 0.2s;
    }
    .resource-card:hover .play-overlay {
      background: rgba(0,0,0,0.5);
    }
    .play-overlay svg {
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    }

    .resource-card:hover {
      transform: translateY(-3px); box-shadow: 0 12px 28px -10px rgba(0,0,0,0.1);
    }
    .preview-area {
      height: 160px; background: #F3F4F6; display: grid; place-items: center;
      color: #9CA3AF; font-size: 0.85rem; border-bottom: 1px solid #E5E7EB;
      position: relative;
    }
    .preview-area img {
      width: 100%; height: 100%; object-fit: cover; object-position: top;
    }
    .preview-placeholder {
      text-align: center; padding: 20px;
    }
    .preview-placeholder svg { margin-bottom: 8px; color: #C5C9D4; }
    .card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
    .card-body h3 {
      font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; line-height: 1.35;
    }
    .card-meta {
      font-size: 0.85rem; color: #5A5A72; margin-bottom: 10px; display: flex;
      flex-wrap: wrap; gap: 6px 12px;
    }
    .type-badge {
      display: inline-block; background: #EEF2FF; color: #3B5BDB;
      font-size: 0.75rem; font-weight: 600; padding: 3px 10px; border-radius: 20px;
      margin-bottom: 10px; align-self: flex-start;
    }
    .card-desc {
      font-size: 0.9rem; color: #5A5A72; line-height: 1.5; margin-bottom: 16px; flex: 1;
    }
    .card-actions { display: flex; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; border: none; transition: all 0.2s; text-decoration: none; flex: 1;
    }
    .btn-primary { background: #3B5BDB; color: white; }
    .btn-primary:hover { background: #2F4AC0; }
    .btn-outline { background: white; border: 1.5px solid #E5E7EB; color: #1A1A2E; }
    .btn-outline:hover { border-color: #C5C9D4; background: #FAFAFA; }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 60px 20px; background: white;
      border: 1.5px solid #E5E7EB; border-radius: 16px; margin-bottom: 40px;
    }
    .empty-state h2 { font-size: 1.3rem; margin-bottom: 10px; }
    .empty-state p { color: #5A5A72; margin-bottom: 24px; }

    @media (max-width: 700px) {
      .nav { padding: 12px 16px; }
      .container { padding: 24px 16px 60px; }
      .secondary-row { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
    }

      { id: 411, subject: 'English Home Language', title: 'English HL P1 Memo – November 2022', grade: '12', year: '2022', exam: 'NSC', type: 'memorandum', pages: 8, description: 'Official DBE marking memorandum for English HL Paper 1, November 2022.', previewImage: './core/demo-data/library-previews/grade-12.png', hasDownload: true },
      { id: 412, subject: 'English Home Language', title: 'English HL P2 Memo – November 2022', grade: '12', year: '2022', exam: 'NSC', type: 'memorandum', pages: 10, description: 'Official DBE marking memorandum for English HL Paper 2, November 2022.', previewImage: './core/demo-data/library-previews/grade-12.png', hasDownload: true },
      { id: 413, subject: 'English Home Language', title: 'English HL P3 Memo – November 2022', grade: '12', year: '2022', exam: 'NSC', type: 'memorandum', pages: 4, description: 'Official DBE marking guidelines for English HL Paper 3 (essay), November 2022.', previewImage: './core/demo-data/library-previews/grade-12.png', hasDownload: true },
      // ---- Additional Educational Videos ----
      { id: 300, subject: 'Life Sciences', title: 'The Eye – Structure & Function', grade: '12', year: '2024', exam: 'Mindset Learn', type: 'video', youtubeId: 'aK8tuu8SVBg', channel: 'Mindset Learn', description: 'How the human eye is structured and how vision works – Grade 12 Life Sciences.', hasDownload: false },
      { id: 301, subject: 'Life Sciences', title: 'Exam Questions (Live)', grade: '12', year: '2024', exam: 'Mindset Learn', type: 'video', youtubeId: 'eL_3Ars6Wcc', channel: 'Mindset Learn', description: 'Worked Grade 12 Life Sciences exam-style questions with full explanations.', hasDownload: false },
      { id: 302, subject: 'Agricultural Sciences', title: 'Animal Nutrition and Digestion – Term 1', grade: '12', year: '2024', exam: 'SA Agri Sciences', type: 'video', youtubeId: '_KhSK601r5k', channel: 'SA Agri Sciences', description: 'CAPS-aligned lesson on animal nutrition and digestion for Grade 12 Agricultural Sciences.', hasDownload: false },
      { id: 303, subject: 'Agricultural Sciences', title: 'Animal Nutrition', grade: '12', year: '2024', exam: 'SA Agri Sciences', type: 'video', youtubeId: 'FGaon1Vgp4M', channel: 'SA Agri Sciences', description: 'Grade 12 Agricultural Sciences lesson covering ruminant and non-ruminant animal nutrition.', hasDownload: false },
      { id: 304, subject: 'English Home Language', title: 'Creative Writing & Essay Recap', grade: '12', year: '2024', exam: 'English HL Grade 12', type: 'video', youtubeId: 'H0VIqFD3wIs', channel: 'English HL Grade 12', description: 'Recap of essay-writing technique for the Grade 12 English HL Paper 3 creative writing section.', hasDownload: false },
      { id: 305, subject: 'English Home Language', title: 'FAL Paper 1: Language – Whole Show', grade: '12', year: '2024', exam: 'Mindset Learn', type: 'video', youtubeId: 'BBn4PpkZYkc', channel: 'Mindset Learn', description: 'Full Learn Xtra broadcast working through the English language paper: comprehension and summary.', hasDownload: false },
      { id: 306, subject: 'English Home Language', title: 'How to Write the Perfect Essay – Paper 3', grade: '12', year: '2024', exam: 'English HL Grade 12', type: 'video', youtubeId: 'GSNue2utdlQ', channel: 'English HL Grade 12', description: 'Step-by-step guide to choosing a topic and structuring the Grade 12 English Paper 3 essay.', hasDownload: false },

    ];

    // ========== STATE ==========
    let activeType = 'all';
    // Default to the Learner's active Subject so Library feels personalised
    let activeSubject = (GapMapAuth.getActiveSubject && GapMapAuth.getActiveSubject()) || user.subject || 'all';
    if (activeSubject && activeSubject !== 'all') {
      activeSubject = GapMapAuth.normalizeSubject(activeSubject) || activeSubject;
    }
    let searchTerm = '';

    const userGrade = user.grade || null;

    // ========== HELPER FUNCTIONS ==========
    function getFilteredResources() {
      let filtered = resources;

      // Filter every Resource by the Learner's exact grade. A video labelled
      // for Grade 12 must never appear in Grade 10 or Grade 11.
      if (userGrade) {
        filtered = filtered.filter(r => r.grade === userGrade);
      }

      // Filter by type
      if (activeType !== 'all') {
        filtered = filtered.filter(r => r.type === activeType);
      }

      // Filter by subject
      if (activeSubject !== 'all') {
        filtered = filtered.filter(r => r.subject === activeSubject);
      }

      // Filter by search term
      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        filtered = filtered.filter(r =>
          r.title.toLowerCase().includes(term) ||
          r.subject.toLowerCase().includes(term) ||
          (r.year && r.year.includes(term)) ||
          (r.exam && r.exam.toLowerCase().includes(term)) ||
          (r.channel && r.channel.toLowerCase().includes(term)) ||
          r.description.toLowerCase().includes(term)
        );
      }

      return filtered;
    }

    function getAvailableSubjects() {
      const subjects = new Set();
      resources
        .filter(r => !userGrade || r.grade === userGrade)
        .forEach(r => subjects.add(r.subject));
      return ['all', ...Array.from(subjects)];
    }

    // Always show all known types, even if no resources exist yet.
    function getAvailableTypes() {
      return ['all', 'question-paper', 'video', 'book', 'study-guide', 'revision', 'memorandum'];
    }

    // ========== RENDER ==========
    function render() {
      const app = document.getElementById('app');
      const filtered = getFilteredResources();
      const subjects = getAvailableSubjects();
      const types = getAvailableTypes();

      const typeLabels = {
        'all': 'All',
        'question-paper': 'Question Papers',
        'video': 'Videos',
        'book': 'Books',
        'study-guide': 'Study Guides',
        'revision': 'Revision',
        'memorandum': 'Memorandums'
      };

      const typeChipsHtml = types.map(t => `
        <button class="chip ${activeType === t ? 'active' : ''}" data-type="${t}">
          ${typeLabels[t] || t}
        </button>
      `).join('');

      const subjectChipsHtml = subjects.map(s => `
        <button class="subject-chip ${activeSubject === s ? 'active' : ''}" data-subject="${s}">
          ${s === 'all' ? 'All subjects' : s}
        </button>
      `).join('');

      // Empty state message specific to the selected type
      let emptyMessage = 'Try adjusting your filters or search term.';
      const subjLabel = activeSubject !== 'all' ? activeSubject : (GapMapAuth.getActiveSubject() || 'this subject');
      if (activeType === 'video') {
        emptyMessage = `No videos yet for ${subjLabel}. Try Mathematics or Physical Sciences, or check back soon.`;
      } else if (activeType !== 'all' && typeLabels[activeType]) {
        const typeName = typeLabels[activeType];
        emptyMessage = `No ${typeName} yet for ${subjLabel}. We're adding them soon.`;
      } else if (activeSubject !== 'all') {
        emptyMessage = `No resources found for ${subjLabel}. Try another subject or clear filters.`;
      }

      const gridHtml = filtered.length > 0
        ? filtered.map(r => {
            // Video cards use YouTube thumbnail
            let preview;
            if (r.type === 'video' && r.youtubeId) {
              const thumb = 'https://img.youtube.com/vi/' + r.youtubeId + '/hqdefault.jpg';
              preview = `<div class="preview-area video-preview">
                           <img src="${thumb}" alt="${r.title}">
                           <div class="play-overlay">
                             <svg width="48" height="48" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
                           </div>
                         </div>`;
            } else if (r.previewImage) {
              preview = `<div class="preview-area"><img src="${r.previewImage}" alt="${r.title} front page"></div>`;
            } else {
              preview = `<div class="preview-area"><div class="preview-placeholder">
                   <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                   <p>Preview coming soon</p>
                 </div></div>`;
            }

            const metaHtml = r.type === 'video'
              ? `<div class="card-meta">
                    <span>Grade ${r.grade}</span>
                    <span>${r.channel || r.exam}</span>
                  </div>`
              : `<div class="card-meta">
                    <span>Grade ${r.grade}</span>
                    <span>${r.year}</span>
                    <span>${r.exam}</span>
                  </div>`;

            const actionsHtml = r.type === 'video' && r.youtubeId
              ? `<a href="https://www.youtube.com/watch?v=${r.youtubeId}" target="_blank" rel="noopener" class="btn btn-primary">Watch on YouTube</a>`
              : (r.hasDownload
                  ? `<a href="/api/download?id=${r.id}&disposition=inline" target="_blank" class="btn btn-primary">View</a>
                     <a href="/api/download?id=${r.id}" class="btn btn-outline">Download</a>`
                  : `<span class="btn btn-outline" style="opacity:0.5;cursor:default">Coming soon</span>`);

            return `
              <div class="resource-card">
                ${preview}
                <div class="card-body">
                  <span class="type-badge">${typeLabels[r.type] || r.type}</span>
                  <h3>${r.title}</h3>
                  ${metaHtml}
                  <p class="card-desc">${r.description}</p>
                  <div class="card-actions">
                    ${actionsHtml}
                  </div>
                </div>
              </div>
            `;
          }).join('')
        : `
          <div class="empty-state">
            <h2>No resources found</h2>
            <p>${emptyMessage}</p>
            <button class="btn btn-primary" onclick="resetFilters()">Clear Filters</button>
          </div>
        `;

      app.innerHTML = `
        <div class="page-header">
          <h1>Your Grade ${userGrade || '?'} Library</h1>
          <p>Question papers, educational videos, study guides and more – filtered for your grade.</p>
        </div>

        <div class="chips-row">${typeChipsHtml}</div>

        <div class="secondary-row">
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Search by title, year, exam..." value="${searchTerm}">
          </div>
          <div class="subject-chips">${subjectChipsHtml}</div>
        </div>

        <div class="resource-grid">${gridHtml}</div>
      `;

      // Attach event listeners after render
      document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          activeType = chip.dataset.type;
          render();
        });
      });
      document.querySelectorAll('.subject-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          activeSubject = chip.dataset.subject;
          render();
        });
      });
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', (e) => {
        searchTerm = e.target.value.trim();
        render();
      });
    }

    // Expose reset function for empty state
    window.resetFilters = function() {
      activeType = 'all';
      activeSubject = 'all';
      searchTerm = '';
      render();
    };

    // Initial render
    render();
  })();
  </script>
  <script src="frontend/agentPanel/agent-panel.js"></script>
</body>
</html>
