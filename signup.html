<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up for GapMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="frontend/agentPanel/agent-panel.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #1A1A2E;
      background: #F8FAFC;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .signup-card {
      background: #FFFFFF;
      border: 1.5px solid #E5E7EB;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .fade-out { opacity: 0; transform: scale(0.96); pointer-events: none; }
    .hidden { display: none; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 4px; text-decoration: none; }
    .brand-text { font-weight: 700; font-size: 1.35rem; color: #1A1A2E; }
    .logo-icon { width: 32px; height: 32px; background: #3B5BDB; border-radius: 50%; display: grid; place-items: center; position: relative; }
    .logo-icon::after { content: ''; width: 10px; height: 10px; background: white; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); margin-top: -2px; }
    .microcopy { text-align: center; color: #5A5A72; font-size: 0.9rem; margin-bottom: 28px; }
    .role-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .role-option {
      padding: 12px; border: 1.5px solid #E5E7EB; border-radius: 10px; text-align: center;
      font-weight: 500; cursor: pointer; transition: all 0.2s; background: #FFFFFF; color: #5A5A72;
    }
    .role-option:hover { border-color: #C5C9D4; }
    .role-option.selected { border-color: #3B5BDB; background: #EEF2FF; color: #3B5BDB; }
    .role-option input[type="radio"] { display: none; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #1A1A2E; }
    .form-group input {
      width: 100%; padding: 12px 16px; border: 1.5px solid #E5E7EB; border-radius: 10px;
      font-size: 1rem; font-family: inherit; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #3B5BDB; box-shadow: 0 0 0 4px rgba(59, 91, 219, 0.1); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 1rem;
      cursor: pointer; border: none; transition: all 0.2s; text-decoration: none; width: 100%; margin-top: 6px;
    }
    .btn-primary { background: #3B5BDB; color: white; }
    .btn-primary:hover { background: #2F4AC0; }
    .btn-primary:disabled { background: #9CA3AF; cursor: not-allowed; }
    .otp-section { display: none; margin-top: 10px; animation: slideUp 0.4s ease forwards; }
    .otp-section.active { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .otp-title { text-align: center; font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
    .otp-subtitle { text-align: center; color: #5A5A72; font-size: 0.9rem; margin-bottom: 20px; }
    .otp-inputs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
    .otp-inputs input {
      width: 48px; height: 56px; text-align: center; font-size: 1.5rem; font-weight: 700;
      border: 1.5px solid #E5E7EB; border-radius: 10px; outline: none; font-family: inherit;
    }
    .otp-inputs input:focus { border-color: #3B5BDB; box-shadow: 0 0 0 4px rgba(59, 91, 219, 0.1); }
    .otp-actions { display: flex; gap: 12px; }
    .otp-actions .btn { width: auto; flex: 1; }
    .btn-outline { background: white; border: 1.5px solid #E5E7EB; color: #1A1A2E; }
    .btn-outline:hover { border-color: #C5C9D4; background: #FAFAFA; }
    .success-msg {
      display: none; text-align: center; padding: 20px; background: #ECFDF5;
      border: 1px solid #6EE7B7; border-radius: 10px; color: #065F46; font-weight: 500; margin-top: 20px;
    }
    .success-msg.active { display: block; animation: slideUp 0.4s ease forwards; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #5A5A72; }
    .auth-footer a { color: #3B5BDB; font-weight: 600; text-decoration: none; }
    .demo-hint {
      margin-top: 12px; font-size: 0.8rem; color: #5A5A72; text-align: center;
      background: #F8FAFC; padding: 8px 12px; border-radius: 8px;
    }
    @media (max-width: 480px) {
      .signup-card { padding: 32px 20px; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
      .otp-inputs input { width: 40px; height: 48px; font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="signup-card" id="signupCard">
    <a href="index.html" class="brand">
      <div class="logo-icon"></div>
      <span class="brand-text">GapMap</span>
    </a>
    <p class="microcopy">Start your personalised learning journey today.</p>

    <div class="role-selector" id="roleSelector">
      <label class="role-option selected" for="role-learner">
        <input type="radio" name="role" id="role-learner" value="learner" checked> Learner
      </label>
      <label class="role-option" for="role-teacher">
        <input type="radio" name="role" id="role-teacher" value="teacher"> Teacher
      </label>
    </div>

    <form id="signupForm">
      <div class="form-row">
        <div class="form-group">
          <label for="firstname">First name</label>
          <input type="text" id="firstname" placeholder="Thabo" required>
        </div>
        <div class="form-group">
          <label for="lastname">Last name</label>
          <input type="text" id="lastname" placeholder="Mokoena" required>
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a strong password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Create Account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <div class="signup-card hidden" id="otpCard">
    <div class="brand">
      <div class="logo-icon"></div>
      <span class="brand-text">GapMap</span>
    </div>
    <div class="otp-section active">
      <div class="otp-title">Verify your email</div>
      <div class="otp-subtitle">
        We sent a 6-digit code to <strong id="displayEmail">you@example.com</strong>.<br>
        Please check your inbox and enter it below.
      </div>
      
      <div class="otp-inputs" id="otpInputs">
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
        <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
      </div>

      <div class="otp-actions">
        <button class="btn btn-outline" id="resendBtn">Resend code</button>
        <button class="btn btn-primary" id="verifyBtn">Verify</button>
      </div>

      <div class="demo-hint" id="demoHint">Demo: your code is <strong id="demoCode">------</strong></div>

      <div class="success-msg" id="successMsg">
        Account verified! Taking you to setup…
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      try {
        const raw = localStorage.getItem('gapmap_user');
        if (raw) {
          const u = JSON.parse(raw);
          if (u.setupComplete) window.location.replace('dashboard.html');
          else window.location.replace('setup.html');
        }
      } catch (e) {}

      const options = document.querySelectorAll('.role-option');
      options.forEach(option => {
        option.addEventListener('click', function() {
          options.forEach(opt => opt.classList.remove('selected'));
          this.classList.add('selected');
          this.querySelector('input[type="radio"]').checked = true;
        });
      });

      const signupForm = document.getElementById('signupForm');
      const signupCard = document.getElementById('signupCard');
      const otpCard = document.getElementById('otpCard');
      const displayEmail = document.getElementById('displayEmail');
      const submitBtn = document.getElementById('submitBtn');
      const resendBtn = document.getElementById('resendBtn');
      const verifyBtn = document.getElementById('verifyBtn');
      const otpInputs = document.querySelectorAll('#otpInputs input');
      const successMsg = document.getElementById('successMsg');
      const demoCodeEl = document.getElementById('demoCode');

      let currentOTP = '';
      let pendingUser = null;

      signupForm.addEventListener('submit', function(e) {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending code…';

        const firstName = document.getElementById('firstname').value.trim();
        const lastName = document.getElementById('lastname').value.trim();
        const email = document.getElementById('email').value.trim().toLowerCase();
        const role = document.querySelector('input[name="role"]:checked').value;

        displayEmail.textContent = email;
        currentOTP = Math.floor(100000 + Math.random() * 900000).toString();
        demoCodeEl.textContent = currentOTP;

        pendingUser = {
          email,
          firstName,
          lastName,
          role: role === 'teacher' ? 'teacher' : 'learner',
          language: null,
          explanationLevel: null,
          subject: null,
          setupComplete: false,
          createdAt: new Date().toISOString()
        };

        console.log(`[DEMO] OTP ${currentOTP} for ${email}`);

        signupCard.classList.add('fade-out');
        setTimeout(() => {
          signupCard.classList.add('hidden');
          signupCard.classList.remove('fade-out');
          otpCard.classList.remove('hidden');
          otpInputs[0].focus();
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }, 400);
      });

      otpInputs.forEach((input, index) => {
        input.addEventListener('input', function() {
          this.value = this.value.replace(/[^0-9]/g, '');
          if (this.value.length === 1 && index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
          }
        });
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Backspace' && this.value === '' && index > 0) {
            otpInputs[index - 1].focus();
          }
        });
      });

      verifyBtn.addEventListener('click', function() {
        let enteredCode = '';
        otpInputs.forEach(input => enteredCode += input.value);

        if (enteredCode === currentOTP && pendingUser) {
          localStorage.setItem('gapmap_user', JSON.stringify(pendingUser));
          successMsg.classList.add('active');
          verifyBtn.disabled = true;
          document.getElementById('demoHint').style.display = 'none';

          setTimeout(() => {
            window.location.href = 'setup.html';
          }, 1200);
        } else {
          alert('Incorrect code. Please try again. (Demo code is shown below the buttons.)');
          otpInputs.forEach(input => input.value = '');
          otpInputs[0].focus();
        }
      });

      resendBtn.addEventListener('click', function() {
        resendBtn.textContent = 'Sending…';
        resendBtn.disabled = true;
        currentOTP = Math.floor(100000 + Math.random() * 900000).toString();
        demoCodeEl.textContent = currentOTP;
        console.log(`[DEMO] Resent OTP ${currentOTP}`);
        otpInputs.forEach(input => input.value = '');
        otpInputs[0].focus();
        resendBtn.textContent = 'Resend code';
        resendBtn.disabled = false;
      });
    });
  </script>
  <script src="frontend/agentPanel/agent-panel.js"></script>
</body>
</html>
