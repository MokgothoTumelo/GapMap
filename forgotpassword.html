<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password · Forgot password</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
        }

        /* ----- NEW HEADER STYLES ----- */
        .page-header {
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0 1.25rem 0;
            margin-bottom: 0.25rem;
            border-bottom: 1px solid rgba(31, 79, 138, 0.10);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            color: #0b2a4a;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.3px;
        }

        .brand i {
            font-size: 1.6rem;
            color: #1f4f8a;
            background: #eef4ff;
            padding: 0.35rem;
            border-radius: 14px;
            box-shadow: 0 4px 8px -4px rgba(0,0,0,0.05);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-actions a {
            color: #3f5f80;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.15s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .header-actions a:hover {
            color: #0d2b4a;
        }

        .header-actions .signup-link {
            background: #1f4f8a;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px -6px rgba(31, 79, 138, 0.3);
        }

        .header-actions .signup-link:hover {
            background: #144074;
            color: white;
            transform: scale(1.02);
        }

        /* ----- CARD (slightly adjusted top padding) ----- */
        .reset-card {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: #ffffff;
            border-radius: 2.5rem;
            padding: 2rem 2rem 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 8px 20px -8px rgba(0, 20, 40, 0.15);
            transition: box-shadow 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-top: 0.25rem;
        }

        .reset-card:hover {
            box-shadow: 0 30px 60px -12px rgba(0, 20, 40, 0.3);
        }

        .icon-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            background: #eef4ff;
            border-radius: 50%;
            margin: 0 auto 1.2rem auto;
            color: #1f4f8a;
            font-size: 2.2rem;
            box-shadow: 0 8px 16px -6px rgba(31, 79, 138, 0.15);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #0b2a4a;
            text-align: center;
            margin-bottom: 0.35rem;
        }

        .subhead {
            text-align: center;
            color: #4a5e75;
            font-size: 0.98rem;
            line-height: 1.5;
            margin-bottom: 2rem;
            padding: 0 0.25rem;
        }

        .subhead strong {
            color: #1f4f8a;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.75rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e3a5f;
            margin-bottom: 0.45rem;
            letter-spacing: 0.01em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #f2f7fd;
            border-radius: 60px;
            border: 1px solid #dce6f0;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: #1f4f8a;
            box-shadow: 0 0 0 4px rgba(31, 79, 138, 0.15);
            background: #ffffff;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            color: #6b85a0;
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-wrapper:focus-within i {
            color: #1f4f8a;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 3rem;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-weight: 450;
            color: #0b2a4a;
            outline: none;
            border-radius: 60px;
        }

        .input-wrapper input::placeholder {
            color: #8a9eb5;
            font-weight: 400;
            opacity: 0.8;
        }

        .hint-text {
            margin-top: 0.5rem;
            font-size: 0.82rem;
            color: #5a728b;
            padding-left: 0.5rem;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin: 2rem 0 1.2rem;
        }

        .btn-primary {
            background: #1f4f8a;
            border: none;
            padding: 0.9rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.05rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 18px -8px rgba(31, 79, 138, 0.35);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            letter-spacing: 0.3px;
        }

        .btn-primary i {
            font-size: 1rem;
        }

        .btn-primary:hover {
            background: #144074;
            transform: scale(1.01);
            box-shadow: 0 12px 24px -10px rgba(31, 79, 138, 0.45);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #cbd8e8;
            padding: 0.75rem 1.5rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1f3b5c;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-secondary i {
            color: #5f7b99;
            font-size: 0.9rem;
        }

        .btn-secondary:hover {
            background: #f0f6fe;
            border-color: #a6bcd9;
        }

        .feedback-message {
            margin: 1.2rem 0 0.2rem;
            padding: 0.9rem 1.2rem;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #f0f7fe;
            color: #124072;
            border-left: 5px solid #1f4f8a;
            transition: all 0.25s ease;
            opacity: 0;
            transform: translateY(6px);
            pointer-events: none;
        }

        .feedback-message.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .feedback-message i {
            font-size: 1.25rem;
            color: #1f4f8a;
        }

        .feedback-message.error {
            background: #fff0ee;
            border-left-color: #b33a3a;
            color: #952b2b;
        }

        .feedback-message.error i {
            color: #b33a3a;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            margin-top: 1.8rem;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #3f5f80;
            text-decoration: none;
            font-weight: 450;
            transition: color 0.15s;
            border-bottom: 1px dotted transparent;
        }

        .footer-links a:hover {
            color: #0d2b4a;
            border-bottom-color: #1f4f8a;
        }

        /* responsive */
        @media (max-width: 450px) {
            .reset-card {
                padding: 2rem 1.25rem;
            }
            h1 {
                font-size: 1.6rem;
            }
            .page-header {
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            .header-actions .signup-link {
                padding: 0.3rem 0.8rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NEW HEADER ===== -->
    <header class="page-header">
        <a href="#" class="brand">
            <span>GapMap</span>
        </a>
        <div class="header-actions">
            <a href="login.html"><i class="fas fa-sign-in-alt"></i> Log in</a>
            <a href="signup.html" class="signup-link"><i class="fas fa-user-plus"></i> Sign up</a>
        </div>
    </header>

    <!-- ===== MAIN CARD ===== -->
    <div class="reset-card" role="main" aria-label="Password reset form">
        <div class="icon-circle">
            <i class="fas fa-lock"></i>
        </div>
        <h1>Reset password</h1>
        <p class="subhead">
            Enter the email address linked to your account.<br>
            We'll send a <strong>reset link</strong> to that email.
        </p>

        <!-- Reset form -->
        <form id="resetForm" novalidate>
            <div class="form-group">
                <label for="resetEmail"><i class="fas fa-envelope" style="margin-right: 6px; color: #1f4f8a;"></i> Email address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input 
                        type="email" 
                        id="resetEmail" 
                        placeholder="your@email.com" 
                        required 
                        autocomplete="email"
                        aria-describedby="emailHint"
                    >
                </div>
                <div class="hint-text" id="emailHint">We'll send a password reset link to this address.</div>
            </div>

            <div class="action-buttons">
                <button type="submit" class="btn-primary" id="resetBtn">
                    <i class="fas fa-paper-plane"></i> Send reset link
                </button>
                    <a href="login.html" class="back to login">back to login</a> 
            </div>
        </form>

        <!-- feedback message (hidden by default) -->
        <div id="feedbackMessage" class="feedback-message">
            <i class="fas fa-circle-check"></i>
            <span id="feedbackText">Reset link sent to your email.</span>
        </div>
    </div>-

    <script>
        (function() {
            // DOM elements
            const form = document.getElementById('resetForm');
            const emailInput = document.getElementById('resetEmail');
            const feedbackDiv = document.getElementById('feedbackMessage');
            const feedbackText = document.getElementById('feedbackText');
            const resetBtn = document.getElementById('resetBtn');
            const backBtn = document.getElementById('backToLoginBtn');
            const helpLink = document.getElementById('helpLink');
            const contactLink = document.getElementById('contactLink');

            // helper: show feedback (type: 'success' or 'error')
            function showFeedback(message, type = 'success') {
                feedbackText.textContent = message;
                // remove previous classes
                feedbackDiv.classList.remove('error', 'show');
                // force reflow for smooth transition
                void feedbackDiv.offsetWidth;
                if (type === 'error') {
                    feedbackDiv.classList.add('error');
                } else {
                    feedbackDiv.classList.remove('error');
                }
                feedbackDiv.classList.add('show');
            }

            // hide feedback (called after timeout or on new interaction)
            function hideFeedback() {
                feedbackDiv.classList.remove('show');
            }

            // validate email format (basic but robust)
            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            // simulate sending reset link (demo)
            function sendResetLink(email) {
                return new Promise((resolve, reject) => {
                    // Simulate network delay (400–800ms)
                    const delay = Math.floor(Math.random() * 400) + 400;
                    setTimeout(() => {
                        // In a real app, we'd call an API. 
                        // For demo, we always "succeed" unless email is 'fail@example.com' (to show error)
                        if (email.toLowerCase() === 'fail@example.com') {
                            reject(new Error('This email is not registered in our system.'));
                        } else {
                            resolve({ message: `Reset link sent to ${email}` });
                        }
                    }, delay);
                });
            }

            // handle form submission
            async function handleReset(e) {
                e.preventDefault();

                // remove any previous feedback
                hideFeedback();

                // get email and trim
                const email = emailInput.value.trim();

                // 1. client-side validation
                if (!email) {
                    showFeedback('Please enter your email address.', 'error');
                    emailInput.focus();
                    return;
                }

                if (!isValidEmail(email)) {
                    showFeedback('Please enter a valid email address (e.g., name@domain.com).', 'error');
                    emailInput.focus();
                    return;
                }

                // disable button during "request"
                resetBtn.disabled = true;
                resetBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
                // also change cursor
                resetBtn.style.opacity = '0.8';

                try {
                    // call async function (simulated)
                    const result = await sendResetLink(email);
                    // success feedback
                    showFeedback(`✅ ${result.message}`, 'success');
                    // clear input (optional, but user-friendly)
                    emailInput.value = '';
                    // auto-hide after 8 seconds
                    setTimeout(() => {
                        hideFeedback();
                    }, 8000);
                } catch (error) {
                    // error feedback
                    showFeedback(`❌ ${error.message || 'Something went wrong. Please try again.'}`, 'error');
                    // keep email for retry
                } finally {
                    // re-enable button
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send reset link';
                    resetBtn.style.opacity = '1';
                }
            }

            // ----- attach event listeners -----

            // submit form
            form.addEventListener('submit', handleReset);

            // back to login button (demo)
            backBtn.addEventListener('click', function(e) {
                e.preventDefault();
                hideFeedback();
                // Simple demo: show a message
                showFeedback('🔐 Redirecting to login page... (demo)', 'success');
                setTimeout(() => {
                    hideFeedback();
                    // Reset form & clear any message
                    form.reset();
                }, 2500);
            });

            // Help link (demo)
            helpLink.addEventListener('click', function(e) {
                e.preventDefault();
                hideFeedback();
                showFeedback('📘 Check our help center for password recovery tips.', 'success');
                setTimeout(() => hideFeedback(), 4000);
            });

            // Contact support link (demo)
            contactLink.addEventListener('click', function(e) {
                e.preventDefault();
                hideFeedback();
                showFeedback('📧 Support team: support@example.com (demo)', 'success');
                setTimeout(() => hideFeedback(), 4000);
            });

            // If user types in email field, hide feedback (clean UX)
            emailInput.addEventListener('input', function() {
                if (feedbackDiv.classList.contains('show')) {
                    hideFeedback();
                }
            });

            console.log('🔐 Forgot password / reset password demo ready.');
            console.log('ℹ️  To test error, use "fail@example.com" as email.');
        })();
    </script>
</body>
</html>
