  - item_id: q12
    answer: 1                         # chose "x = 2 or x = -2"
    correct: false
    time_ms: 26700
    feedback: >
      x^2 + 4x + 4 is a perfect square: (x + 2)^2, so the only root is x = -2
      (a repeated root). You treated it as a difference of squares, which it
      isn't -- there's no subtraction.
