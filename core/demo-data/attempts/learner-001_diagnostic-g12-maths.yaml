    answer: 1                         # chose "(x + 1)(x + 6)"
    correct: false
    time_ms: 24400
    feedback: >
      You picked factors that multiply to 6, but 1 + 6 = 7, not 5. For
      x^2 + 5x + 6 you need two numbers that BOTH multiply to 6 AND add to 5
      -- that's 2 and 3, giving (x + 2)(x + 3).
  - item_id: q9
    answer: 1                         # chose "(x - 2)(x + 2)" -- dropped the 2
    correct: false
    time_ms: 28900
    feedback: >
      You factored x^2 - 4 into (x - 2)(x + 2) correctly, but you dropped the
      common factor. 2x^2 - 8 = 2(x^2 - 4) = 2(x - 2)(x + 2). Always check for
      a common factor first.
  - item_id: q10
    answer: 1                         # chose "x = 4"
    correct: false
    time_ms: 9800
    feedback: >
      You took the square root but kept only the positive root. x^2 = 16 has
      two solutions: x = 4 and x = -4, since both square to 16.
  - item_id: q11
