    answer: 1                         # chose "-9"
    correct: false
    time_ms: 31200
    feedback: >
      You treated -2^2 as -(2^2) = -4, then did -4 - 5 = -9. But f(-2) means
      substitute -2 into x^2, which is (-2)^2 = 4. So f(-2) = 4 - 5 = -1.
      Tip: when you see f(-2) with a squared term, write (-2)^2 with the
      brackets so you don't lose the sign.
