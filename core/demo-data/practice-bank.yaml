  - '41'
  - −31
  - '9'
  correct: 0
  wrong_explanations:
  - answer: 2
    explanation: 'You treated −5 as +5: b² − 4ac = 9 − 4(2)(−5) = 9 + 40 = 49, not −31.'
    kind: procedure
  - answer: 3
    explanation: b² − 4ac is 9 + 40 here — the −4ac term with a negative c becomes +40; leaving it out gives 9.
    kind: procedure
