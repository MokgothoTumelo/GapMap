- id: q1
  concept: Quadratic Equations
  prompt_type: multiple_choice
  prompt: 'Choose the correct option: Solve: x² − 5x + 6 = 0'
  options:
  - x = 2 or x = 3
  - x = −2 or x = −3
  - x = 1 or x = 6
  - x = −1 or x = −6
  correct: 0
  wrong_explanations:
  - answer: 2
    explanation: (x − 2)(x − 3) = 0 gives x = 2 and x = 3; setting the factors to zero with the wrong sign loses both roots.
    kind: procedure
  - answer: 3
    explanation: 'You found a factor pair of 6 that adds to 7, not 5 — the factoring step failed, not the solving: 1 and 6
      give (x + 1)(x + 6) = x² + 7x + 6.'
    kind: prerequisite
    prerequisite: Factorisation
