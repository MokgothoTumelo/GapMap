  concept: Factorisation
  prompt_type: multiple_choice
  prompt: 'Select the best response to: Factorise: 2x² + 7x + 3'
  options:
  - (2x + 1)(x + 3)
  - (2x + 3)(x + 1)
  - (x + 3)(x + 1)
  - (2x − 1)(x − 3)
  correct: 0
