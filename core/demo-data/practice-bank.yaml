- id: q27
  concept: Factorisation
  prompt_type: multiple_choice
  prompt: 'Which option gives the correct answer? Factorise completely: x² − 9'
  options:
  - (x − 3)(x + 3)
  - (x − 9)(x + 1)
  - (x − 3)²
  - x(x − 9)
  correct: 0
  wrong_explanations:
  - answer: 1
    explanation: '−9 × 1 = −9 and the middle term would be −8x; you need factors of 9 that differ to cancel the middle term:
      3 and −3.'
    kind: procedure
  - answer: 2
    explanation: (x − 3)² = x² − 6x + 9. A difference of squares needs conjugate factors (x − 3)(x + 3).
    kind: concept
