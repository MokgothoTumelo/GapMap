items:
  - id: q1
    concept: Factorisation
    difficulty: easy
    prompt: "Factorise completely: x² − 16"
    prompt_type: multiple_choice
    options: ["(x − 4)(x + 4)", "(x − 8)(x + 2)", "(x − 4)²", "x(x − 16)"]
    correct: 0
    correct_explanation: "x² − 16 = x² − 4² = (x − 4)(x + 4). This is the difference of squares pattern."
    wrong_explanations:
      - answer: 1
        explanation: "These factors multiply to x² − 6x − 16, so they do not reproduce the original expression."
      - answer: 2
        explanation: "Squaring (x − 4) gives x² − 8x + 16, not x² − 16."
      - answer: 3
        explanation: "Taking x outside leaves x − 16, but x² − 16 has no common factor of x."

  - id: q2
    concept: Factorisation
    difficulty: easy
    prompt: "Factorise: x² + 7x + 12"
    prompt_type: multiple_choice
    options: ["(x + 3)(x + 4)", "(x + 2)(x + 6)", "(x + 1)(x + 12)", "(x − 3)(x − 4)"]
    correct: 0
    correct_explanation: "3 × 4 = 12 and 3 + 4 = 7, so x² + 7x + 12 = (x + 3)(x + 4)."
    wrong_explanations:
      - answer: 1
        explanation: "2 × 6 = 12, but 2 + 6 = 8 rather than the required middle coefficient 7."
      - answer: 2
        explanation: "1 × 12 = 12, but 1 + 12 = 13 rather than 7."
      - answer: 3
        explanation: "These factors produce a negative middle term and a positive constant, not +7x."

  - id: q3
    concept: Factorisation
    difficulty: medium
    prompt: "Factorise: 2x² + 5x + 2"
    prompt_type: multiple_choice
    options: ["(2x + 1)(x + 2)", "(2x + 2)(x + 1)", "(x + 1)(x + 2)", "(2x − 1)(x − 2)"]
    correct: 0
    correct_explanation: "(2x + 1)(x + 2) expands to 2x² + 4x + x + 2 = 2x² + 5x + 2."
    wrong_explanations:
      - answer: 1
        explanation: "These factors expand to 2x² + 4x + 2, so the middle coefficient is too small."
      - answer: 2
        explanation: "These factors have leading coefficient 1, but the original expression has leading coefficient 2."
      - answer: 3
        explanation: "Both factors use subtraction, producing a negative middle term rather than +5x."
