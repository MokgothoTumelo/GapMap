items:
  # ---- Multiple choice (10) ----
  - id: q1
    concept: Algebra
    prompt_type: multiple_choice
    prompt: "Simplify: 3(x + 4) − 2(x − 1)"
    options:
      - "x + 14"
      - "x + 10"
      - "5x + 14"
      - "x − 14"
    correct: 0
    wrong_explanations:
      - answer: 1
        explanation: "You distributed 3 correctly but wrote −2(x − 1) as −2x − 2; the minus applies to both terms, so −2(x − 1) = −2x + 2."
        kind: procedure
      - answer: 2
        explanation: "You added the outer numbers without distributing: 3(x + 4) is 3x + 12, not 5x + 12."
        kind: procedure

  - id: q2
    concept: Algebra
    prompt_type: multiple_choice
    prompt: "Expand: (2x − 3)(x + 5)"
    options:
      - "2x² + 7x − 15"
      - "2x² + 10x − 3x − 15"
      - "2x² − 15"
      - "2x² + 7x + 15"
    correct: 0
    wrong_explanations:
      - answer: 1
        explanation: "Correct so far: 2x² + 10x − 3x − 15. Combine the like terms 10x − 3x to finish."
        kind: procedure
      - answer: 3
        explanation: "The cross-terms are right (7x), but the second factor multiplies −15, not +15."
        kind: procedure

  - id: q3
    concept: Factorisation
    prompt_type: multiple_choice
    prompt: "Factorise completely: x² − 9"
    options:
      - "(x − 3)(x + 3)"
      - "(x − 9)(x + 1)"
      - "(x − 3)²"
      - "x(x − 9)"
    correct: 0
    wrong_explanations:
      - answer: 1
        explanation: "−9 × 1 = −9 and the middle term would be −8x; you need factors of 9 that differ to cancel the middle term: 3 and −3."
        kind: procedure
      - answer: 2
        explanation: "(x − 3)² = x² − 6x + 9. A difference of squares needs conjugate factors (x − 3)(x + 3)."
        kind: concept

  - id: q4
    concept: Factorisation
    prompt_type: multiple_choice
    prompt: "Factorise: 2x² + 7x + 3"
    options:
      - "(2x + 1)(x + 3)"
      - "(2x + 3)(x + 1)"
      - "(x + 3)(x + 1)"
      - "(2x − 1)(x − 3)"
    correct: 0
    wrong_explanations:
      - answer: 1
        explanation: "(2x + 3)(x + 1) expands to 2x² + 5x + 3 — the cross-terms give 5x, not 7x."
        kind: procedure
      - answer: 2
        explanation: "(x + 3)(x + 1) has leading coefficient 1, but 2x² + 7x + 3 needs a leading coefficient of 2."
        kind: concept

  - id: q5
    concept: Functions
    prompt_type: multiple_choice
    prompt: "If f(x) = 2x + 3, what is f(4)?"
    options:
      - "11"
      - "8"
      - "5"
      - "14"
    correct: 0
    wrong_explanations:
      - answer: 1
        explanation: "You stopped at 2(4) = 8 and left off the + 3; substitute fully: 2(4) + 3 = 11."
        kind: procedure
      - answer: 2
        explanation: "You added 3 and 2 first, then multiplied by 1. Substitution multiplies first: 2(4) + 3."
        kind: procedure

  - id: q6
    concept: Functions
    prompt_type: multiple_choice
    prompt: "What is the domain of f(x) = √(x − 2)?"
    options:
      - "x ≥ 2"
      - "x > 2"
      - "x ≤ 2"
      - "All real numbers"
    correct: 0
    wrong_explanations:
      - answer: 1
        explanation: "√(x − 2) is defined at x = 2 too — the square root of zero exists — so the endpoint is included: x ≥ 2."
        kind: concept
      - answer: 3
        explanation: "The expression under the root must be non-negative: x − 2 ≥ 0 gives x ≥ 2, not x ≤ 2."
        kind: concept

  - id: q7
    concept: Quadratic Equations
    prompt_type: multiple_choice
    prompt: "Solve: x² − 5x + 6 = 0"
    options:
      - "x = 2 or x = 3"
      - "x = −2 or x = −3"
      - "x = 1 or x = 6"
      - "x = −1 or x = −6"
    correct: 0
    wrong_explanations:
      - answer: 2
        explanation: "(x − 2)(x − 3) = 0 gives x = 2 and x = 3; setting the factors to zero with the wrong sign loses both roots."
        kind: procedure
      - answer: 3
        explanation: "You found a factor pair of 6 that adds to 7, not 5 — the factoring step failed, not the solving: 1 and 6 give (x + 1)(x + 6) = x² + 7x + 6."
        kind: prerequisite
        prerequisite: Factorisation

  - id: q8
    concept: Quadratic Equations
    prompt_type: multiple_choice
    prompt: "What is the discriminant of 2x² + 3x − 5 = 0?"
    options:
      - "49"
      - "41"
      - "−31"
      - "9"
    correct: 0
    wrong_explanations:
      - answer: 2
        explanation: "You treated −5 as +5: b² − 4ac = 9 − 4(2)(−5) = 9 + 40 = 49, not −31."
        kind: procedure
      - answer: 3
        explanation: "b² − 4ac is 9 + 40 here — the −4ac term with a negative c becomes +40; leaving it out gives 9."
        kind: procedure

  - id: q9
    concept: Exponents & Surds
    prompt_type: multiple_choice
    prompt: "Simplify: (3² × 3⁴) ÷ 3³"
    options:
      - "3³"
      - "3⁵"
      - "3²"
      - "3⁹"
    correct: 0
    wrong_explanations:
      - answer: 1
        explanation: "Adding exponents (2 + 4 = 6) is right, but dividing subtracts: 3⁶ ÷ 3³ = 3³."
        kind: procedure
      - answer: 3
        explanation: "You added all three exponents (2 + 4 + 3). Multiplication adds indices; division subtracts: 3^(2+4−3) = 3³."
        kind: concept

  - id: q10
    concept: Algebra
    prompt_type: multiple_choice
    prompt: "Solve for x: 5x − 7 = 3x + 9"
    options:
      - "x = 8"
      - "x = 1"
      - "x = −8"
      - "x = 16"
    correct: 0
    wrong_explanations:
      - answer: 1
        explanation: "Subtracting 3x gives 2x − 7 = 9, and adding 7 to both sides gives 2x = 16 — you subtracted the 7 instead of adding it."
        kind: procedure
      - answer: 3
        explanation: "2x = 16 is right, but x = 16 ÷ 2 = 8 — you stopped before dividing by 2."
        kind: procedure

