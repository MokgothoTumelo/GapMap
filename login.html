<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to GapMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="frontend/agentPanel/agent-panel.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #1A1A2E;
      background: #F8FAFC;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: #FFFFFF;
      border: 1.5px solid #E5E7EB;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
      text-decoration: none;
    }
    .brand-text { font-weight: 700; font-size: 1.35rem; color: #1A1A2E; }
    .logo-icon {
      width: 32px; height: 32px; background: #3B5BDB; border-radius: 50%;
      display: grid; place-items: center; position: relative;
    }
    .logo-icon::after {
      content: ''; width: 10px; height: 10px; background: white;
      border-radius: 50% 50% 50% 0; transform: rotate(-45deg); margin-top: -2px;
    }
    .microcopy {
      text-align: center; color: #5A5A72; font-size: 0.9rem; margin-bottom: 32px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: #1A1A2E;
    }
    .form-group input {
      width: 100%; padding: 12px 16px; border: 1.5px solid #E5E7EB; border-radius: 10px;
      font-size: 1rem; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s; outline: none;
    }
    .form-group input:focus {
      border-color: #3B5BDB; box-shadow: 0 0 0 4px rgba(59, 91, 219, 0.1);
    }
    .form-options {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.85rem; margin-bottom: 24px;
    }
    .form-options label {
      display: flex; align-items: center; gap: 8px; color: #5A5A72; cursor: pointer;
    }
    .form-options input[type="checkbox"] { width: 16px; height: 16px; accent-color: #3B5BDB; }
    .form-options a { color: #3B5BDB; text-decoration: none; font-weight: 500; }
    .form-options a:hover { text-decoration: underline; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 1rem;
      cursor: pointer; border: none; transition: all 0.2s; text-decoration: none; width: 100%;
    }
    .btn-primary { background: #3B5BDB; color: white; }
    .btn-primary:hover { background: #2F4AC0; }
    .btn-primary:disabled { background: #9CA3AF; cursor: not-allowed; }
    .error-msg {
      display: none; background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA;
      border-radius: 10px; padding: 12px 16px; font-size: 0.9rem; margin-bottom: 16px;
    }
    .error-msg.show { display: block; }
    .auth-footer {
      text-align: center; margin-top: 24px; font-size: 0.9rem; color: #5A5A72;
    }
    .auth-footer a { color: #3B5BDB; font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      .login-card { padding: 32px 20px; }
      .form-options { flex-direction: column; gap: 12px; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <a href="index.html" class="brand">
      <div class="logo-icon"></div>
      <span class="brand-text">GapMap</span>
    </a>
    <p class="microcopy">Log in to continue your personalised learning path.</p>

    <div id="errorMsg" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <div class="form-options">
        <label>
          <input type="checkbox" id="goDiagnostic" checked>
          Go to Diagnostic after login
        </label>
        <a href="forgotpassword.html">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary" id="loginBtn">Log In</button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a href="signup.html">Sign up</a>
    </p>
  </div>

  <script>
    (function() {
      const raw = localStorage.getItem('gapmap_user');
      if (!raw) return;
      try {
        const user = JSON.parse(raw);
        if (user.setupComplete) {
          window.location.replace('dashboard.html');
        } else {
          window.location.replace('setup.html');
        }
      } catch (e) {}
    })();

    // If a protected page's Guest Lock sent us here, show the message it
    // left in sessionStorage (see frontend/js/auth-guard.js). Read this
    // directly rather than loading auth-guard.js here — that file also
    // hides the page until a protected-page script calls requireAuth(),
    // which this page (a public one) never does.
    (function showRedirectMessage() {
      let message = null;
      try {
        message = sessionStorage.getItem('gapmap_auth_message');
        if (message) sessionStorage.removeItem('gapmap_auth_message');
      } catch (e) {}
      if (!message) return;
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = message;
      errorEl.classList.add('show');
    })();

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');

      errorEl.classList.remove('show');
      errorEl.textContent = '';

      if (!email || !password) {
        errorEl.textContent = 'Please enter email and password.';
        errorEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      setTimeout(() => {
        let existing = null;
        try {
          const prev = localStorage.getItem('gapmap_user');
          if (prev) {
            const p = JSON.parse(prev);
            if (p.email === email) existing = p;
          }
        } catch (e) {}

        const user = {
          email,
          firstName: existing?.firstName || email.split('@')[0],
          lastName: existing?.lastName || '',
          role: existing?.role || 'learner',
          language: existing?.language || null,
          explanationLevel: existing?.explanationLevel || null,
          subject: existing?.subject || null,
          setupComplete: existing?.setupComplete || false,
          loggedInAt: new Date().toISOString()
        };

        localStorage.setItem('gapmap_user', JSON.stringify(user));

        const goDiagnostic = document.getElementById('goDiagnostic').checked;

        if (!user.setupComplete) {
          window.location.href = 'setup.html';
        } else if (goDiagnostic) {
          window.location.href = 'diagnostic.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      }, 400);
    });
  </script>
  <script src="frontend/agentPanel/agent-panel.js"></script>
</body>
</html>
